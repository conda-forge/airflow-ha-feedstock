schema_version: 1

context:
  name: airflow-ha
  version: "1.6.6"
  python_min: "3.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/5a/1e/a696a6fd30337de25ea66c1324a76c576dea2da515596fd67c153e23a477/airflow_ha-1.6.6.tar.gz
  sha256: d57d7bf7f9ac8c29a0839e376ba9c03a2b81e02e811154bd0170a19842ad86ea

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - airflow-pydantic >=1.6,<1.8

tests:
  - python:
      imports:
        - airflow_ha
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: High Availability (HA) DAG Utility
  description: High Availability (HA) DAG Utility
  homepage: https://github.com/airflow-laminar/airflow-ha
  repository: https://github.com/airflow-laminar/airflow-ha

extra:
  recipe-maintainers:
    - timkpaine
