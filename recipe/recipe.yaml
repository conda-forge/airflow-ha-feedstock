schema_version: 1

context:
  name: airflow-ha
  version: "1.6.7"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/5a/8c/7bf9754a8f928a9171a19424e4bca5cce5e10b4496aacc6464feb92129c8/airflow_ha-${{ version }}.tar.gz
  sha256: 250d8deeb542bd4f09c3f4bff5e9798dc9948759c32c39e1901f974cece7d8c0

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - airflow-pydantic >=1.6,<1.8

tests:
  - python:
      imports:
        - airflow_ha
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: High Availability (HA) DAG Utility
  description: High Availability (HA) DAG Utility
  homepage: https://github.com/airflow-laminar/airflow-ha
  repository: https://github.com/airflow-laminar/airflow-ha

extra:
  recipe-maintainers:
    - timkpaine
